model_selection:
  module_0:
    class: RandomForestClassifier
    module: sklearn.ensemble
    params:
      n_estimators: 120
      max_depth: 12
      min_samples_split: 5
      random_state: 42
    search_param_grid:
      n_estimators:
        - 100
        - 150
      max_depth:
        - 8
        - 12

  module_1:
    class: XGBClassifier
    module: xgboost
    params:
      n_estimators: 150
      learning_rate: 0.08
      max_depth: 6
      random_state: 42
      eval_metric: logloss
    search_param_grid:
      n_estimators:
        - 100
        - 150
      learning_rate:
        - 0.05
        - 0.1

  module_2:
    class: CatBoostClassifier
    module: catboost
    params:
      iterations: 200
      learning_rate: 0.08
      depth: 6
      verbose: 0
      random_state: 42
    search_param_grid:
      iterations:
        - 150
        - 200
